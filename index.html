<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دارنا ما - فريجة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFC107">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Tajawal',system-ui;background:#fff8e1}
.top{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,0.9);backdrop-filter:blur(10px);padding:10px 15px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px #0001}
.top img{width:48px;height:48px;border-radius:12px;object-fit:contain;background:white;padding:3px}
.top b{font-size:20px}
.search{flex:1;background:#f1f1f1;border:1px solid #ddd;border-radius:20px;padding:8px 14px}
.hero{text-align:center;padding:30px 20px}
.hero-logo{width:140px;height:140px;background:white;border-radius:24px;padding:10px;box-shadow:0 8px 20px #0002;object-fit:contain}
.hero h1{margin:15px 0 5px;color:#333;font-size:32px}
.hero p{color:#666;margin:0}
.btn{background:#FFC107;color:#000;border:none;padding:14px 35px;border-radius:30px;font-weight:900;font-size:18px;margin-top:18px;box-shadow:0 4px 10px #ffc10788}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:white;border-radius:16px;padding:10px;box-shadow:0 2px 8px #0001;text-align:center}
.card img{width:100%;height:90px;object-fit:contain}
.price{color:#0d6efd;font-weight:900}
</style>
</head>
<body>
<div class="top">
<img src="logo.png" alt="logo">
<b>دارنا ما</b>
<input class="search" placeholder="شنو كتقلب؟">
</div>

<div class="hero">
<img src="logo.png" class="hero-logo" alt="دارنا ما">
<h1>دارنا ما</h1>
<p>فريجة - سوق الخميس - أجود المنتوجات</p>
<button class="btn" onclick="alert('مرحبا! تواصل معنا على واتساب')">تسوق دابا 🛒</button>
</div>

<div class="products">
<div class="card"><img src="logo.png"><div>عسل حر</div><div class="price">150 درهم</div></div>
<div class="card"><img src="logo.png"><div>زيت أركان</div><div class="price">120 درهم</div></div>
<div class="card"><img src="logo.png"><div>أملو</div><div class="price">80 درهم</div></div>
<div class="card"><img src="logo.png"><div>كسكس بلدي</div><div class="price">45 درهم</div></div>
</div>

</body>
</html>
