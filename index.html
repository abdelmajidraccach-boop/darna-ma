<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Darna.ma - عقار المغرب</title>
<style>
body{font-family:system-ui;background:#f8fafc;margin:0}
header{background:#0f172a;color:#fff;padding:15px;display:flex;justify-content:space-between}
.logo{font-weight:800;font-size:22px}.logo span{color:#22c55e}
.hero{background:linear-gradient(120deg,#0f172a,#1e40af);color:#fff;padding:40px 20px;text-align:center}
.search{margin:20px auto;max-width:600px;display:flex;gap:8px;background:#fff;padding:8px;border-radius:12px}
.search input{flex:1;border:0;outline:0;padding:10px}.search button{background:#22c55e;color:#fff;border:0;padding:10px 20px;border-radius:8px;font-weight:bold}
.grid{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;height:180px;object-fit:cover}.info{padding:12px}.price{color:#16a34a;font-weight:800}
.btn{display:block;text-align:center;background:#0f172a;color:#fff;padding:10px;border-radius:10px;text-decoration:none;margin-top:8px}
</style></head>
<body>
<header><div class="logo">Darna<span>.ma</span></div><div>🇲🇦 عقار المغرب</div></header>
<div class="hero"><h1>لقى دارك فالمغرب</h1><p>شقق، فيلات، أراضي - كازا، الرباط، مراكش</p>
<div class="search"><input placeholder="قلب: كازا، الرباط..."><button>بحث</button></div></div>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2"><div class="info"><div class="price">850,000 درهم</div>شقة 3 غرف - عين الذياب - كازا<a class="btn" href="https://wa.me/212600000000">واتساب</a></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9"><div class="info"><div class="price">1,200,000 درهم</div>فيلا - تاركة - مراكش<a class="btn" href="https://wa.me/212600000000">واتساب</a></div></div>
<div class="card"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c"><div class="info"><div class="price">650,000 درهم</div>شقة - تمارة - الرباط<a class="btn" href="https://wa.me/212600000000">واتساب</a></div></div>
</div>
</body>
</html>
