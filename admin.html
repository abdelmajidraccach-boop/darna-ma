<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برج التحكم</title><style>*{box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff;padding:16px}input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff}.box{background:#111;border:1px solid #222;border-radius:14px;padding:14px;margin:12px 0}button{background:#FFC300;color:#000;border:none;padding:12px;border-radius:10px;font-weight:800;width:100%;margin-top:8px}</style></head><body><h2 style="color:#FFC300">⚙️ برج التحكم DARNA.MA</h2><div class="box"><select id="cat"><option>شقة</option><option>فيلا</option><option>أرض</option><option>محل</option></select><select id="type"><option>بيع</option><option>كراء</option></select><input id="price" placeholder="الثمن"><input id="title" placeholder="العنوان"><input id="city" placeholder="المدينة"><input id="img" placeholder="رابط الصورة"><button onclick="let it={cat:cat.value,type:type.value,price:price.value,title:title.value,city:city.value,img:img.value||'https://picsum.photos/400/300'};let d=JSON.parse(localStorage.getItem('darna_data')||'[]');d.unshift(it);localStorage.setItem('darna_data',JSON.stringify(d));alert('تم ✅')">نشر 🚀</button></div><div class="box"><h3>📱 QR Code</h3><center><img id="qr" style="width:200px;background:#fff;padding:10px;border-radius:12px"><div style="margin-top:8px;font-size:12px">abdelmajidraccach-boop.github.io/darna-ma</div></center></div><button onclick="location.href='index.html'" style="background:#222;color:#fff">رجوع للرئيسية</button><script>qr.src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://abdelmajidraccach-boop.github.io/darna-ma/"</script></body></html>
